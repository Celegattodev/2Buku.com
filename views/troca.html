<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Troca</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/troca/troca.css">
</head>

<body>
    <header>
        <nav id="navbar">
            <img id="navbar_logo" src="/img/Logo-Buku-branco.png" alt="Logo" />
            <ul id="nav_list">
                <li class="nav-item active"><a href="#">Sobre Nós</a></li>
                <li class="nav-item"><a href="#">Funcionamento</a></li>
                <li class="nav-item"><a href="#">Perguntas Frequentes</a></li>
            </ul>
            <button class="btn-default">Cadastrar/Entrar</button>
            <button id="mobile_btn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </nav>
        <div id="mobile_menu">
            <ul id="mobile_nav_list">
                <li class="nav-item"><a href="#">Sobre Nós</a></li>
                <li class="nav-item"><a href="#">Funcionamento</a></li>
                <li class="nav-item"><a href="#">Perguntas Frequentes</a></li>
            </ul>
            <button class="btn-default">Cadastrar/Entrar</button>
        </div>
    </header>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="card bg-white shadow-lg mb-5">
                <div class="card-body">
                    <div class="title text-center mt-2 mb-5">
                        <h3>Detalhes da Troca</h3>
                    </div>
                    <div class="user-info mb-4">
                        <h4>Informações do Solicitante</h4>
                        <p><strong>Nome:</strong> <span id="user-name"></span></p>
                        <p><strong>Telefone:</strong> <span id="user-phone"></span></p>
                        <p><strong>Cidade:</strong> <span id="user-city"></span></p>
                        <p><strong>UF:</strong> <span id="user-state"></span></p>
                    </div>
                    <div class="books">
                        <div class="user-book mb-3">
                            <div class="desc text-center">
                                <h4><b>Livro Oferecido</b></h4>
                            </div>
                            <div class="book">
                                <img id="offered-book-image" src="" alt="Livro Oferecido" class="img-book">
                            </div>
                            <div class="desc text-center">
                                <p id="offered-book-title"></p>
                                <p id="offered-book-author" class="author"></p>
                            </div>
                        </div>
                        <div class="user-book mb-3">
                            <div class="desc text-center">
                                <h4><b>Seu Livro</b></h4>
                            </div>
                            <div class="book">
                                <img id="requested-book-image" src="" alt="Seu Livro" class="img-book">
                            </div>
                            <div class="desc text-center">
                                <p id="requested-book-title"></p>
                                <p id="requested-book-author" class="author"></p>
                            </div>
                        </div>
                    </div>
                    <div class="buttons-enchange mb-3">
                        <button type="button" class="btn text-white" id="confirm-button"><b>Aceitar</b></button>
                        <button type="button" class="btn text-white" id="deny-button"><b>Negar</b></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="js/troca/troca.js"></script>
    <script src="/js/navbar.js"></script>
</body>

</html>
