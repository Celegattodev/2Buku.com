<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador - Gerenciar usuários</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/admin/admin_gerenciar_usuarios.css">
</head>
<body>

    <!-- VLIBRAS -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>
  
    <header>
        <nav id="navbar">
            <a href="/inicio">
                <img id="navbar_logo" src="/img/Logo-Buku-branco.png" alt="Logo" />
            </a>
            <ul id="nav_list">
                <li class="nav-item active"><a href="/inicio">Sobre Nós</a></li>
                <li class="nav-item"><a href="/inicio">Funcionamento</a></li>
                <li class="nav-item"><a href="/inicio">Perguntas Frequentes</a></li>
            </ul>
            <button id="mobile_btn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </nav>
        <div id="mobile_menu">
            <ul id="mobile_nav_list">
                <li class="nav-item"><a href="/inicio">Sobre Nós</a></li>
                <li class="nav-item"><a href="/inicio">Funcionamento</a></li>
                <li class="nav-item"><a href="/inicio">Perguntas Frequentes</a></li>
            </ul>
            <button class="btn-default">Cadastrar/Entrar</button>
        </div>
    </header>
    <div class="container-fluid">
        <div class="col d-flex justify-content-center">
            <div class="card mt-4 mb-5 shadow">
                <div class="card-body">
                    <div class="row text-center">
                        <h3>Gerenciar Usuários</h3>
                    </div>
                    <form id="search-form" action="#" method="POST" class="d-flex mb-3">
                        <input type="text" id="search-input" class="form-control" placeholder="Nome de usuário, email...">
                        <button type="submit" class="btn btn-primary ms-2"><i class="fas fa-search"></i></button>
                    </form>
                    <div class="mb-3">
                        <a href="/admin" class="btn" id="btn-back">Voltar</a>
                    </div>
                    <div class="results mt-4">
                        <div class="mt-2">
                            <h5><b>Resultados de pesquisa</b></h5> 
                            <ul class="list-group mt-3">
                                <!-- Os resultados da pesquisa serão inseridos aqui -->
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/admin/admin_gerenciar_usuarios.js"></script>
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
