<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livros Desejados</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/favorites.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        integrity="sha384-k6RqeWeci5ZR/Lv4MR0sA0FfDOM3Tx7W7A9M12YVJc0DApLqD1KkA2V/ZcfO9g8" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- Font Awesome para ícones -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</head>

<body>
    <!-- VLIBRAS -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

<header>
    <nav id="navbar">
        <a href="/inicio">
            <img id="navbar_logo" src="/img/Logo-Buku-branco.png" alt="Logo" />
        </a>
        <ul id="nav_list">
            <li class="nav-item active"><a href="/inicio">Sobre Nós</a></li>
            <li class="nav-item"><a href="/inicio">Funcionamento</a></li>
            <li class="nav-item"><a href="/inicio">Perguntas Frequentes</a></li>
        </ul>
        <button id="mobile_btn">
            <i class="fa-solid fa-bars"></i>
        </button>
    </nav>
    <div id="mobile_menu">
        <ul id="mobile_nav_list">
            <li class="nav-item"><a href="/inicio">Sobre Nós</a></li>
            <li class="nav-item"><a href="/inicio">Funcionamento</a></li>
            <li class="nav-item"><a href="/inicio">Perguntas Frequentes</a></li>
        </ul>
        <button class="btn-default">Cadastrar/Entrar</button>
    </div>
</header>

  <div class="container-fluid p-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow p-4">
                <div class="d-flex justify-content-start mb-4">
                    <a href="/profile" class="btn btn-secondary">Voltar ao Perfil</a>
                </div>
                <h2 class="text-center mb-4">Lista de Desejos</h2>
                <div class="row" id="favorites-list">
                    <!-- Livros favoritos serão carregados aqui -->
                </div>
                <p id="no-favorites-message" class="text-center">Sem livros desejados</p>
            </div>
        </div>
    </div>
</div>

    <!-- Modal para exibir detalhes do livro -->
    <div class="modal fade" id="bookDetailsModal" tabindex="-1" aria-labelledby="bookDetailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="bookDetailsModalLabel">Detalhes do Livro</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-4">
                            <img id="bookCoverImage" src="" class="img-fluid mb-3" alt="Imagem da Capa">
                        </div>
                        <div class="col-md-8">
                            <p><strong>Autor:</strong> <span id="bookAuthor"></span></p>
                            <p><strong>Editora:</strong> <span id="bookPublisher"></span></p>
                            <p><strong>Ano de Publicação:</strong> <span id="bookPublishedDate"></span></p>
                            <p><strong>Sinopse:</strong> <span id="bookDescription"></span></p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/books/favorites.js"></script>
</body>

</html>
